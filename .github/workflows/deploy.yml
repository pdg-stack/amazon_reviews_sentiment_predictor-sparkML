# CI/CD (docs/DEPLOYMENT.md). On merge to main: build
# docker/Dockerfile + docker/log-viewer.Dockerfile, push to ECR, then
# deploy via AWS Systems Manager Run Command -- no SSH, no open port,
# same pattern as everything else in this project. Auth is OIDC federation
# (infra/cicd.tf's aws_iam_openid_connect_provider/role), not long-lived
# AWS keys stored as GitHub secrets.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write # required for OIDC -- configure-aws-credentials exchanges this token for the role below
  contents: read

# AWS_ACCOUNT_ID/EC2_INSTANCE_ID come from repo Settings -> Secrets and
# variables -> Actions -> Variables (not secrets -- neither is sensitive
# enough to need masking in logs, but both are account-specific and don't
# belong hardcoded in a public workflow file).
env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/arsp-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push api image
        run: |
          docker build -f docker/Dockerfile -t "${{ env.ECR_REGISTRY }}/arsp-api:${{ github.sha }}" -t "${{ env.ECR_REGISTRY }}/arsp-api:latest" .
          docker push "${{ env.ECR_REGISTRY }}/arsp-api:${{ github.sha }}"
          docker push "${{ env.ECR_REGISTRY }}/arsp-api:latest"

      - name: Build and push log-viewer image
        run: |
          docker build -f docker/log-viewer.Dockerfile -t "${{ env.ECR_REGISTRY }}/arsp-log-viewer:${{ github.sha }}" -t "${{ env.ECR_REGISTRY }}/arsp-log-viewer:latest" .
          docker push "${{ env.ECR_REGISTRY }}/arsp-log-viewer:${{ github.sha }}"
          docker push "${{ env.ECR_REGISTRY }}/arsp-log-viewer:latest"

      # No SSH: SSM Run Command executes on the instance over its own
      # outbound connection to the SSM service (ec2.tf's "no open port"
      # pattern, same reasoning as the jump-box SSM tunnels used throughout
      # this project). Pulls the just-pushed :latest tags and recreates only
      # the containers whose image actually changed.
      - name: Deploy via SSM Run Command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ec2-user/app","git pull","aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}","docker compose -f docker-compose.cloud.yml pull api log-viewer mlflow-ui","docker compose -f docker-compose.cloud.yml up -d"]' \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ env.EC2_INSTANCE_ID }}" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ env.EC2_INSTANCE_ID }}"
