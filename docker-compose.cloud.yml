# Phase 2/3 cloud serving stack -- runs on the EC2 instance provisioned in
# infra/ec2.tf, NOT locally. No spark-master/spark-worker/pipeline here
# (EMR Serverless handles training, Phase 1) -- api runs its own embedded
# local[*] Spark session, same as .devcontainer/local dev, since inference
# is small-batch and doesn't need a cluster.
#
# Phase 4: api/log-viewer are pre-built images from ECR (GitHub Actions
# builds + pushes on merge to main, see .github/workflows/deploy.yml and
# infra/cicd.tf) -- this instance only ever `docker compose pull`s them,
# never builds locally. `aws ecr get-login-password | docker login` first
# (the deploy workflow's own SSM command does this); the instance's IAM
# role already has the needed ecr:* pull permissions (ec2.tf).
#
# Env comes from .env + .env.aws (same files/convention as local dev's
# optional .env.aws -- see docker-compose.yml's own comment on that).

services:
  api:
    image: 183088117536.dkr.ecr.us-east-1.amazonaws.com/arsp-api:latest
    container_name: api
    working_dir: /workspace
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
      - .env.aws
    restart: unless-stopped
    # The image itself has no src/ -- docker/Dockerfile relies on the repo
    # being bind-mounted over /workspace at runtime (same as docker-compose.yml's
    # local dev services), not baked in at build time.
    volumes:
      - .:/workspace

  mlflow-ui:
    image: 183088117536.dkr.ecr.us-east-1.amazonaws.com/arsp-api:latest
    container_name: mlflow-ui
    working_dir: /workspace
    # --static-prefix: see docker/nginx.conf's /mlflow/ location comment.
    # --allowed-hosts: mlflow 3.x rejects any request whose Host header isn't
    # localhost/a private IP by default (DNS-rebinding protection) -- CloudFront
    # forwards its own domain as Host, not the viewer's, so without this every
    # request arriving through CloudFront gets a 403. CLOUDFRONT_DOMAIN comes
    # from .env.aws since it changes if the distribution is ever recreated
    # (see infra/edge.tf's cloudfront_domain output) -- $$ escapes the compose
    # YAML's own variable substitution so the container's shell expands it
    # from the env_file below, not tofu/compose at parse time.
    command: >
      sh -c "mlflow ui --host 0.0.0.0 --port 5000 --static-prefix /mlflow
      --allowed-hosts localhost,$$CLOUDFRONT_DOMAIN"
    env_file:
      - .env.aws  # MLFLOW_TRACKING_URI (RDS), CLOUDFRONT_DOMAIN
    restart: unless-stopped

  log-viewer:
    image: 183088117536.dkr.ecr.us-east-1.amazonaws.com/arsp-log-viewer:latest
    container_name: log-viewer
    working_dir: /workspace
    # Continuation lines MUST stay at this same indentation, not deeper (not
    # visually aligned under the opening quote) -- YAML's folded scalar (>)
    # only replaces a line break with a space when consecutive lines share
    # the same indentation; a MORE-indented line keeps its break literal.
    # A deeper-indented version of this exact block produced a command
    # string with real embedded newlines, which a shell treats as three
    # separate statements -- the trailing "|" continues the pipe onto the
    # next line, but --real-time-html then ran as its own (nonexistent)
    # command: "sh: --real-time-html: not found", confirmed by testing.
    command: >
      sh -c "python3 src/scripts/tail_to_clf.py logs/api_requests.log |
      goaccess --log-format=COMBINED -o /workspace/logs/log-viewer-report.html
      --real-time-html --port=7890 --addr=0.0.0.0 --no-global-config -"
    restart: unless-stopped
    volumes:
      - .:/workspace

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    # %(domain)s/%(protocol)s in GF_SERVER_ROOT_URL are filled from Grafana's
    # OWN server.domain/server.protocol config, not inferred from the
    # incoming request -- those default to localhost/http, so Grafana was
    # redirecting every request to http://localhost/grafana/, unreachable
    # from outside the instance. GF_SERVER_PROTOCOL also controls what
    # protocol Grafana's OWN listener speaks, not just the redirect URL's
    # text -- setting it to https switched the listener into TLS-only mode,
    # which nginx (plain HTTP to this internal hop; CloudFront already
    # terminates TLS at the edge) can't talk to, hence a 400 from nginx.
    # Building the full root_url as a plain literal (no %(...)s template,
    # no touching GF_SERVER_PROTOCOL) sidesteps both problems: Grafana's
    # listener stays on its default http, external links are still https.
    entrypoint: ["sh", "-c"]
    command:
      - export GF_SERVER_ROOT_URL="https://$$CLOUDFRONT_DOMAIN/grafana/" && exec /run.sh
    environment:
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # RDS `app` schema is the one and only datasource (provisioned below) --
      # no separate login flow needed for a single-operator dashboard.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    env_file:
      - .env.aws  # APP_DB_*, CLOUDFRONT_DOMAIN
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/workspace/logs:ro # log-viewer-report.html -- see nginx.conf's /logs/ comment
    depends_on:
      - api
      - mlflow-ui
      - log-viewer
      - grafana

volumes:
  grafana-data:
