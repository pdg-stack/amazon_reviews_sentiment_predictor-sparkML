# Splits the single docker/Dockerfile image into
# independently-running services backed by a real standalone Spark cluster,
# instead of each process running its own embedded local[*] Spark. Every
# service below is built FROM THE SAME IMAGE/Dockerfile -- same pinned
# pyspark==3.5.3 everywhere -- because Spark requires the client and cluster
# to run the exact same version; a mismatched pyspark on the client talking
# to this cluster will fail with serialization/protocol errors.
#
# `api` is NOT one of those clients, despite that framing above -- it used
# to submit each /predict call as a Spark job (first to this cluster, then
# earlier still to its own embedded local[*] session), but a real load test
# found that collapsing well before 1,000 concurrent requests: every
# request still paid Spark's fixed per-job overhead no matter how trivial
# the actual computation was. It now scores requests via
# src/serving/lightweight_scorer.py, a plain-Python reimplementation of the
# trained model's own learned parameters -- no SparkSession, no cluster
# connection, nothing Spark-version-pinned about it at all. Only `pipeline`
# (training/batch jobs, where Spark's distributed execution genuinely
# earns its overhead on millions of rows) is still a real client of this
# cluster.
#
# Two different things are both called "Spark UI" -- don't conflate them:
#   - Master UI (spark-master, port 8080): persistent, always up whenever
#     spark-master is running, independent of any particular job. THIS is
#     what makes "Spark UI" a genuinely independent, always-on service.
#   - Driver/application UI (port 4040): only exists while a specific
#     application's driver process is alive -- today that's only a one-off
#     `pipeline` job, never `api` (see above). It's hosted by the driver
#     itself, which is inherent to Spark's architecture and can't be fully
#     separated out even with a cluster. Available on `pipeline` via
#     `--service-ports` (profile-gated, so not exposed by default) -- NOT a
#     persistent/independent service the way the master UI is.
#
# The .devcontainer / VS Code workflow is untouched by any of this: it never
# sets SPARK_MASTER_URL, so src/config.py's get_spark_session() keeps
# defaulting to local[*] there. Only the services below set it explicitly.
#
# Bind mounts (not named volumes) throughout, matching this project's
# existing philosophy (see docs/ARCHITECTURE_NOTES.md) of keeping data/models/logs/
# mlruns out of the image entirely, always mounted from the host -- same
# host paths the .devcontainer setup already uses. spark-master is the only
# service that does NOT need this: it only manages worker registration and
# app scheduling, it never reads a data/model file itself. spark-worker DOES
# need it (see its own comment below) -- task execution happens there, and
# Spark's `file:///workspace/...` reads must resolve on whichever container
# the task actually runs on, not just the driver's.

services:
  # Persistent, independent Spark Master -- this is "Spark UI" as its own
  # service. Master UI: http://localhost:8080. Cluster endpoint other
  # services submit to: spark://spark-master:7077.
  spark-master:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: amazon-reviews-sentiment:latest
    container_name: spark-master
    command: >
      /usr/local/lib/python3.11/site-packages/pyspark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host 0.0.0.0 --port 7077 --webui-port 8080
    # NOTE: the pip-installed pyspark distribution's sbin/ does NOT include
    # start-master.sh/start-worker.sh (only spark-daemon.sh, spark-config.sh,
    # and the history-server scripts -- verified by inspecting the installed
    # package). We invoke spark-class directly instead, which is what those
    # missing scripts would have wrapped anyway, and it runs in the
    # foreground, which is what a container command needs.
    ports:
      - "8080:8080"  # Master UI
      - "7077:7077"  # cluster endpoint (spark-master:7077 from other containers)
    # No repo files needed here -- just the Spark binaries already baked
    # into the image.

  # Spark worker -- registers with spark-master and actually executes tasks.
  # Scale with: docker compose up -d --scale spark-worker=N spark-worker
  # (no `deploy.replicas`/swarm usage elsewhere in this project, so plain
  # `--scale` fits its style better).
  spark-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: amazon-reviews-sentiment:latest
    working_dir: /workspace
    command: >
      /usr/local/lib/python3.11/site-packages/pyspark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 8081
    depends_on:
      - spark-master
    ports:
      - "8081"  # worker UI; no fixed host port so `--scale` doesn't collide
    volumes:
      # Unlike spark-master, the worker DOES need this: Spark distributes
      # file reads to executor processes, which run inside this container --
      # confirmed by testing, an api/pipeline request against models/active/
      # or data/ fails with FileNotFoundException on the executor otherwise,
      # since `file:///workspace/...` paths must resolve identically on
      # every container that runs a task, not just the driver's container.
      - .:/workspace

  # MLflow UI -- browses run/metric/registry history from the bind-mounted
  # models/mlruns/ (sqlite backend, see src/config.py MLFLOW_TRACKING_URI).
  mlflow-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: amazon-reviews-sentiment:latest
    container_name: mlflow-ui
    working_dir: /workspace
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///models/mlruns/mlflow.db
    ports:
      - "5000:5000"
    volumes:
      - .:/workspace

  # FastAPI real-time serving layer. NOT a Spark client (see the top-of-file
  # comment on why) -- scores /predict calls via
  # src/serving/lightweight_scorer.py, reading the active model's exported
  # parameters (models/active/lightweight_model.json) directly off the
  # bind mount below. No SPARK_MASTER_URL, no depends_on the cluster, no
  # driver UI port: there is no SparkSession in this process at all.
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: amazon-reviews-sentiment:latest
    container_name: api
    working_dir: /workspace
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
      - path: .env.aws  # cloud config (RDS/S3) -- optional, absent locally by default; see .env.aws
        required: false
    ports:
      - "8000:8000"  # FastAPI
    volumes:
      - .:/workspace

  # Web dashboard over logs/api_requests.log -- request counts, status-code
  # breakdown, top paths, and response-time charts, via GoAccess. Its own
  # small image (docker/log-viewer.Dockerfile), not the shared
  # docker/Dockerfile -- GoAccess has nothing to do with the rest of
  # this project's dependency set. src/scripts/tail_to_clf.py converts our JSON
  # request log into Combined Log Format on the fly (GoAccess's most
  # reliable input format -- see that script's docstring for why we don't
  # feed it raw JSON directly). logs/api_probes.log (health/metrics hits)
  # is intentionally not fed in here; it's just liveness/scrape traffic.
  log-viewer:
    build:
      context: .
      dockerfile: docker/log-viewer.Dockerfile
    container_name: log-viewer
    working_dir: /workspace
    # Continuation lines MUST stay at this same indentation, not deeper --
    # see docker-compose.cloud.yml's identical command block for why (a
    # deeper-indented version of this exact block broke it there, confirmed
    # by testing against the Phase 2 cloud deployment). --html-refresh=10:
    # also confirmed there -- --real-time-html alone writes the HTML file
    # ONCE at startup and leans on the WebSocket for every update after,
    # so this is the fallback that keeps the file itself current even if a
    # given browser's WebSocket connection isn't the one actually relied on.
    command: >
      sh -c "python3 src/scripts/tail_to_clf.py logs/api_requests.log |
      goaccess --log-format=COMBINED -o /workspace/logs/log-viewer-report.html
      --real-time-html --html-refresh=10 --port=7890 --addr=0.0.0.0 --no-global-config -"
    ports:
      - "8081:7890"
    volumes:
      - .:/workspace

  # Training / batch jobs (train.py, evaluate.py, preprocess.py,
  # data_download.py, set_active_model.py). One service, `profiles: [tools]`
  # so it's excluded from a bare `docker compose up` and never auto-starts
  # or competes with the always-on UI/API containers for resources. Run
  # on-demand:
  #   docker compose run --rm pipeline python src/pipeline/train.py --sample-fraction 0.05
  #   docker compose run --rm pipeline python src/pipeline/evaluate.py --version 3
  #   docker compose run --rm pipeline python src/pipeline/preprocess.py
  #   docker compose run --rm pipeline python src/pipeline/data_download.py
  #   docker compose run --rm pipeline python src/serving/set_active_model.py --version 3
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: amazon-reviews-sentiment:latest
    working_dir: /workspace
    profiles:
      - tools
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      # See the longer comment on `api`'s PYTHONPATH above -- required here
      # so plain `python src/pipeline/train.py`-style invocations (matching
      # the README's documented command shape) can resolve `from src.config
      # import ...`.
      PYTHONPATH: /workspace
    env_file:
      - .env
      - path: .env.aws  # cloud config (RDS/S3) -- optional, absent locally by default; see .env.aws
        required: false
    depends_on:
      - spark-master
      - spark-worker
    volumes:
      - .:/workspace
      # data_download.py reads the Kaggle token from ~/.kaggle -- same bind
      # mount .devcontainer/devcontainer.json uses.
      - ./.kaggle:/root/.kaggle
    # No `ports:` -- add --service-ports on a `docker compose run` invocation
    # if you want to reach this job's driver UI (4040) while it's running.
