# Path-based routing for the cloud stack -- one nginx in front of api,
# mlflow-ui, log-viewer, grafana, so they all sit behind a single CloudFront
# distribution/domain (see infra/edge.tf, docs/DEPLOYMENT.md). Each
# sub-path's own sub-path support is what makes this work, not a generic
# nginx trick -- see the comment on each location block.

events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Default: the API. No prefix stripped -- api itself is not sub-path aware
    # and doesn't need to be, since it's served from the root.
    server {
        listen 80;

        location / {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MLflow's own --static-prefix flag (set on the mlflow-ui service's
        # command) makes it aware it's being served from /mlflow/, so its
        # own asset/API links come out correct -- but that means mlflow-ui
        # expects to SEE the /mlflow/ prefix in the request path, not have
        # it stripped. proxy_pass with no trailing path (no "/" after the
        # port) forwards the full matched URI unmodified, instead of
        # nginx's usual location-prefix replacement -- confirmed by testing
        # against the deployed MLflow version (3.17.2); if a future version
        # doesn't cooperate, split this to its own CloudFront distribution
        # instead (see infra/edge.tf comment).
        location /mlflow/ {
            proxy_pass http://mlflow-ui:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # GoAccess's --real-time-html serves over a WebSocket -- the Upgrade
        # headers below are required for that connection to work through a
        # proxy at all, prefix or not.
        location /logs/ {
            proxy_pass http://log-viewer:7890/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # Grafana's GF_SERVER_ROOT_URL/GF_SERVER_SERVE_FROM_SUB_PATH (set on
        # the grafana service's environment) is the most mature of these
        # three sub-path mechanisms -- least likely to need the CloudFront
        # fallback mentioned above. Like mlflow's /mlflow/ block, no trailing
        # path on proxy_pass: GF_SERVER_SERVE_FROM_SUB_PATH expects the
        # /grafana/ prefix to stay in the request path, not be stripped --
        # stripping it caused an infinite self-redirect loop (confirmed by
        # testing: Grafana kept 301-ing back to its own root_url).
        location /grafana/ {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
